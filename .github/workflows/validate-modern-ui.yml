name: Validate Vite and Tailwind static UI

on:
  push:
    branches: [feat/modern-ui-vite-tailwind4]
    paths:
      - "apps/web/**"
      - "apps/parent/**"
      - "runtime/engine/src/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.frontend.json"
      - "src/**"
      - "scripts/assemble-pages.mjs"
      - "scripts/test/**"
      - ".github/workflows/validate-modern-ui.yml"
  pull_request:
    branches: [fix/parent-home-questpulse-routing, main]
    paths:
      - "apps/web/**"
      - "apps/parent/**"
      - "runtime/engine/src/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.frontend.json"
      - "src/**"
      - "scripts/assemble-pages.mjs"
      - "scripts/test/**"
      - ".github/workflows/validate-modern-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run existing test suites
        run: |
          npm test
          node --test apps/web/test/*.test.mjs apps/parent/test/*.test.mjs

      - name: Build static Pages artifact
        run: npm run build:static

      - name: Verify route preservation and assets
        run: npm run test:static-ui

      - name: Upload preview artifact (no deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tlce-modern-ui-pages-preview
          path: dist/pages
          if-no-files-found: error
          retention-days: 7
