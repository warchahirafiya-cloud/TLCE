name: TLCE Phase 2 Runtime Verification

on:
  push:
    branches:
      - feat/tlce-lazy-islands-phase2
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "modules/questpulse/**"
      - "scripts/**"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/phase2-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Bootstrap dependencies and generate npm lockfile
        run: npm install --no-audit --no-fund

      - name: Verify reproducible install
        run: npm ci --no-audit --no-fund

      - name: TypeScript checks
        run: npm run typecheck

      - name: Oxlint island source audit (non-blocking baseline)
        run: npm run lint:oxc
        continue-on-error: true

      - name: QuestPulse tests
        run: npm run test:questpulse

      - name: Full Node test suite
        run: npm test

      - name: Build static application
        run: npm run build:static

      - name: Static UI regression tests
        run: npm run test:static-ui

      - name: Upload npm lockfile generated by npm
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tlce-phase2-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload build output for inspection (no deployment)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tlce-phase2-static-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
