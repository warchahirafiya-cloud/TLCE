name: Deploy TLCE Integration Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tlce-integration-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate required deployment settings
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
        run: |
          test -n "$CF_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)
          test -n "$ACCESS_TEAM" || (echo "Missing CF_ACCESS_TEAM_DOMAIN repository secret" && exit 1)
          test -n "$ACCESS_AUD" || (echo "Missing CF_ACCESS_AUD repository secret" && exit 1)
      - name: Deploy Worker
        working-directory: infrastructure/production-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          npx --yes wrangler@4 deploy
          printf '%s' "$CF_ACCESS_TEAM_DOMAIN" | npx --yes wrangler@4 secret put CF_ACCESS_TEAM_DOMAIN
          printf '%s' "$CF_ACCESS_AUD" | npx --yes wrangler@4 secret put CF_ACCESS_AUD
          if [ -n "$BRAVE_SEARCH_API_KEY" ]; then
            printf '%s' "$BRAVE_SEARCH_API_KEY" | npx --yes wrangler@4 secret put BRAVE_SEARCH_API_KEY
          fi
          npx --yes wrangler@4 deploy
