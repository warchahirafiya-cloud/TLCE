name: Deploy QuestPulse to GitHub Pages
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: questpulse-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate site before packaging
        run: |
          node --check apps/web/questpulse-catalogue.mjs
          node --check apps/web/questpulse.js
          node --test apps/web/test/*.test.mjs
          node --input-type=module -e "import fs from 'node:fs'; JSON.parse(fs.readFileSync('apps/web/data/offers.json','utf8')); JSON.parse(fs.readFileSync('apps/web/data/guides.json','utf8'));"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: apps/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
