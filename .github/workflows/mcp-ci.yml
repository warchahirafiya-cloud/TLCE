name: TLCE MCP Gateway CI

on:
  push:
    branches:
      - feature/mcp-**
      - pilot/**
  pull_request:
    branches:
      - main
      - pilot/**

permissions:
  contents: read

jobs:
  validate-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
