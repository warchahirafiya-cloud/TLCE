name: Deploy TLCE / QuestPulse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/parent/**"
      - "runtime/engine/src/**"
      - "packages/contracts/src/**"
      - "tsconfig.browser.json"
      - "package.json"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-questpulse-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Validate website
        run: |
          node --check apps/web/questpulse-catalogue.mjs
          node --check apps/web/questpulse.js
          node --test apps/web/test/*.test.mjs
          node --check apps/parent/bootstrap.js
          npm install
          npm run build:browser
          node --input-type=module -e "import fs from 'node:fs'; JSON.parse(fs.readFileSync('apps/web/data/offers.json','utf8')); JSON.parse(fs.readFileSync('apps/web/data/guides.json','utf8'));"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Assemble TLCE parent and QuestPulse site
        run: |
          mkdir -p site/web site/runtime
          cp -R apps/web/. site/web/
          cp apps/parent/index.html apps/parent/404.html apps/parent/bootstrap.js apps/parent/styles.css site/
          cp -R dist/browser/runtime site/
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ -n "$BASE_PATH" ]; then BASE_PATH="/${BASE_PATH#/}"; fi
          BASE_HREF="${BASE_PATH%/}/"
          sed -i "s|__TLCE_BASE_HREF__|$BASE_HREF|g" site/index.html site/404.html
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
