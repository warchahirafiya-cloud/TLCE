name: Deploy TLCE / QuestPulse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-questpulse-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Validate website
        run: |
          node --check apps/web/questpulse-catalogue.mjs
          node --check apps/web/questpulse.js
          node --test apps/web/test/*.test.mjs
          node --input-type=module -e "import fs from 'node:fs'; JSON.parse(fs.readFileSync('apps/web/data/offers.json','utf8')); JSON.parse(fs.readFileSync('apps/web/data/guides.json','utf8'));"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: apps/web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify production Pages deployment
        env:
          SITE_URL: https://warchahirafiya-cloud.github.io/TLCE/
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          const base = process.env.SITE_URL;
          async function get(path) {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(new URL(path, base), {
                  headers: { accept: "*/*", "cache-control": "no-cache" },
                  signal: AbortSignal.timeout(10000),
                });
                if (response.ok) return response;
                lastError = new Error(`${path}: HTTP ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw lastError ?? new Error(`Unable to fetch ${path}`);
          }

          const page = await get("");
          assert.match(page.headers.get("content-type") ?? "", /text\/html/i);
          const html = await page.text();
          assert.match(html, /THE LAST COSMIC EXPLOSION/);
          assert.match(html, /QuestPulse/);
          const csp = html.match(/<meta[^>]+http-equiv=["']Content-Security-Policy["'][^>]+>/i)?.[0];
          assert.ok(csp, "Deployed HTML must include the Content Security Policy meta tag");
          for (const directive of ["default-src 'self'", "object-src 'none'", "script-src 'self'", "connect-src 'self'"]) {
            assert.ok(csp.includes(directive), `Deployed CSP must include ${directive}`);
          }
          assert.ok(!csp.includes("'unsafe-inline'"), "Deployed CSP must not allow unsafe inline execution");

          const assets = [
            ["questpulse.js", /javascript/i],
            ["styles.css", /text\/css/i],
            ["data/offers.json", /json/i],
            ["data/guides.json", /json/i],
          ];
          for (const [path, expectedType] of assets) {
            const response = await get(path);
            assert.match(response.headers.get("content-type") ?? "", expectedType, `${path} has an unexpected content type`);
            const body = await response.text();
            assert.ok(body.length > 0, `${path} must not be empty`);
            if (path.endsWith(".json")) {
              const data = JSON.parse(body);
              assert.ok(Array.isArray(data), `${path} must contain a JSON array`);
              if (path.endsWith("guides.json")) assert.ok(data.length >= 5, "The deployed knowledge base must contain at least five guides");
            }
          }

          console.log("Production smoke check passed: HTML, CSP, JS, CSS, offers and guides.");
          NODE
