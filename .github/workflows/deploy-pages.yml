name: Deploy TLCE / QuestPulse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/parent/**"
      - "runtime/engine/src/**"
      - "packages/contracts/src/**"
      - "tsconfig.browser.json"
      - "package.json"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-questpulse-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate website and build runtime
        run: |
          node --check apps/web/questpulse-catalogue.mjs
          node --check apps/web/questpulse.js
          node --check apps/web/store/store.js
          node --check apps/web/store/product/product.js
          node --check apps/web/store/catalogue.mjs
          node --check apps/parent/bootstrap.js
          node --test apps/web/test/*.test.mjs apps/parent/test/*.test.mjs
          npm install
          npm run typecheck
          npm run test:revenue
          npm run build:browser
          node --input-type=module -e "import fs from 'node:fs'; for (const file of ['apps/web/data/offers.json','apps/web/data/guides.json','apps/web/store/data/apps.json','docs/architecture/TLCE-STORE-submission.schema.json','docs/architecture/TLCE-REVENUE-event.schema.json']) JSON.parse(fs.readFileSync(file,'utf8'));"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Assemble TLCE parent and QuestPulse site
        run: |
          mkdir -p site/web site/runtime site/store
          cp -R apps/web/. site/web/
          cp -R apps/web/store/. site/store/
          cp apps/web/favicon.svg site/favicon.svg
          cp apps/parent/index.html apps/parent/404.html apps/parent/bootstrap.js apps/parent/styles.css site/
          cp -R dist/browser/runtime site/
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ -n "$BASE_PATH" ]; then BASE_PATH="/${BASE_PATH#/}"; fi
          BASE_HREF="${BASE_PATH%/}/"
          sed -i "s|__TLCE_BASE_HREF__|$BASE_HREF|g" site/index.html site/404.html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify production deployment
        env:
          SITE_URL: https://tlce.store/
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          const base = process.env.SITE_URL;
          async function get(path, expectedType) {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(new URL(path, base), {
                  headers: { accept: "*/*", "cache-control": "no-cache" },
                  signal: AbortSignal.timeout(10000),
                });
                if (response.ok) {
                  assert.match(response.headers.get("content-type") ?? "", expectedType, `${path} has an unexpected content type`);
                  return response;
                }
                lastError = new Error(`${path}: HTTP ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw lastError ?? new Error(`Unable to fetch ${path}`);
          }

          const page = await get("", /text\/html/i);
          const html = await page.text();
          assert.match(html, /THE LAST COSMIC EXPLOSION/);
          assert.match(html, /QuestPulse/);
          assert.match(html, /TLCE STORE/);
          assert.match(html, /https:\/\/tlce\.store\/#organization/);
          const csp = html.match(/<meta[^>]+http-equiv=["']Content-Security-Policy["'][^>]+>/i)?.[0];
          assert.ok(csp, "Deployed HTML must include the Content Security Policy meta tag");
          for (const directive of ["default-src 'self'", "object-src 'none'", "script-src 'self'", "connect-src 'self'"]) {
            assert.ok(csp.includes(directive), `Deployed CSP must include ${directive}`);
          }
          assert.ok(!csp.includes("'unsafe-inline'"), "Deployed CSP must not allow unsafe inline execution");

          const assets = [
            ["styles.css", /text\/css/i],
            ["bootstrap.js", /javascript/i],
            ["runtime/engine/src/index.js", /javascript/i],
            ["web/questpulse.js", /javascript/i],
            ["web/styles.css", /text\/css/i],
            ["web/data/offers.json", /json/i],
            ["web/data/guides.json", /json/i],
            ["store/index.html", /text\\/html/i],
            ["store/store.css", /text\\/css/i],
            ["store/store.js", /javascript/i],
            ["store/data/apps.json", /json/i],
          ];
          for (const [path, expectedType] of assets) {
            const response = await get(path, expectedType);
            const body = await response.text();
            assert.ok(body.length > 0, `${path} must not be empty`);
            if (path.endsWith(".json")) {
              const data = JSON.parse(body);
              assert.ok(Array.isArray(data), `${path} must contain a JSON array`);
              if (path.endsWith("guides.json")) {
                assert.ok(data.length >= 5, "The deployed guide catalogue must contain at least five entries");
              }
            }
          }

          console.log("Production smoke check passed: TLCE parent, store, CSP, runtime and catalogues.");
          NODE
