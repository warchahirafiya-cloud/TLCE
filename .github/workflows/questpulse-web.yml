name: QuestPulse Web
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/questpulse-web.yml"
  push:
    branches: ["main", "feature/**"]
    paths:
      - "apps/web/**"
      - ".github/workflows/questpulse-web.yml"

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser modules
        run: node --check apps/web/questpulse-catalogue.mjs && node --check apps/web/questpulse.js
      - name: Validate content catalogues
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const offers=JSON.parse(fs.readFileSync('apps/web/data/offers.json','utf8')); const guides=JSON.parse(fs.readFileSync('apps/web/data/guides.json','utf8')); if(!Array.isArray(offers)||!Array.isArray(guides)||guides.length<1) process.exit(1); console.log('Offers:',offers.length,'Guides:',guides.length)"
      - name: Run browser tests
        run: node --test apps/web/test/*.test.mjs
