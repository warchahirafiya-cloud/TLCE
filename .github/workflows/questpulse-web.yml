name: QuestPulse Web Shell

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/questpulse-web.yml"
  push:
    branches: ["feature/questpulse-browser-shell-rc1"]
    paths:
      - "apps/web/**"
      - ".github/workflows/questpulse-web.yml"

permissions:
  contents: read

jobs:
  validate-web-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalogue module
        run: node --check apps/web/questpulse-catalogue.mjs && node --check apps/web/questpulse.js
      - name: Run browser-shell unit tests
        run: node --test apps/web/test/*.test.mjs
      - name: Verify static entrypoint and empty public catalogue
        run: |
          test -s apps/web/index.html
          test -s apps/web/styles.css
          test "$(cat apps/web/data/offers.json)" = "[]"
