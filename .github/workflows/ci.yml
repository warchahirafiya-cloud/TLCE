name: TLCE CI

on:
  push:
    branches:
      - main
      - feature/**
      - pilot/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
