name = "tlce-integration-api"
main = "index.ts"
compatibility_date = "2026-11-21"
workers_dev = true
preview_urls = false

[vars]
TLCE_ORIGIN = "https://tlce.store"
AI_PROVIDER = "workers-ai"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "tlce-private-uploads"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[triggers]
crons = ["0 */6 * * *"]
